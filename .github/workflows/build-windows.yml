name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Validate JavaScript
        shell: pwsh
        run: |
          node --check main.js
          node --check preload.js
          node --check src/app.js

      - name: Build installer and portable EXE
        run: npm run dist

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Lacivert-Sports-Windows
          path: |
            dist/*.exe
          if-no-files-found: error
