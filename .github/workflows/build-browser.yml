name: Build Larcivert Sports Browser (Android + Windows)

on:
  push:
    branches:
      - larcivert-sports-browser
    paths:
      - "android/**"
      - "desktop/**"
      - ".github/workflows/build-browser.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-apk:
    name: Android APK (debug)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install Android SDK platform
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - name: Build Android APK
        working-directory: android
        run: gradle :app:assembleDebug --no-daemon --stacktrace
      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: Larcivert-Sports-Browser-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

  windows-exe:
    name: Windows EXE installer
    runs-on: windows-latest
    timeout-minutes: 35
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        working-directory: desktop
        run: npm install --no-audit --no-fund
      - name: Build Windows installer
        working-directory: desktop
        run: npm run dist:win
      - name: Upload installer EXE
        uses: actions/upload-artifact@v4
        with:
          name: Larcivert-Sports-Browser-Windows-EXE
          path: desktop/dist/*.exe
          if-no-files-found: error
          retention-days: 30
